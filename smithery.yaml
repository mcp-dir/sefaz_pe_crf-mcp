# Smithery configuration for SEFAZ PE: Certidão de Regularidade Fiscal
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_sefaz_pe_crf

name: sefaz_pe_crf-mcp
displayName: "SEFAZ PE: Certidão de Regularidade Fiscal"
description: >
  SEFAZ PE: Certidão de Regularidade Fiscal, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/sefaz_pe_crf-mcp
repository: https://github.com/mcp-dir/sefaz_pe_crf-mcp

tags:
  - sefaz_pe_crf
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_sefaz_pe_crf

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_sefaz_pe_crf/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
